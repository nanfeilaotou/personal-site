<h1>V0.1 根路径发布验收</h1><p>真实浏览器截图。线上 / 本地使用同一根路径测试脚本；截图使用开发固定时刻以便比较，不改变正式默认模式。竖屏只做基本访问冒烟。</p>
<label>来源 <select id="origin"><option value="online">线上 Cloudflare Pages</option><option value="local">本地 release worktree</option></select></label> <label>桌面尺寸 <select id="size"><option>1440</option><option>1920</option><option>1366</option></select></label><div id="grid"></div>
<script>const names={opening:'根路径 Opening',models:'模型生态',local:'本地 AI',agents:'AI 客户端与 Agent',number:'号码',network:'网络',accounts:'账户与钱包',cards:'支付卡片',personal:'Personal 预留',reduced:'减少动态',nogl:'无 WebGL 后备',mobile:'手机访问冒烟（非精修）'};function update(){const root=document.getElementById('grid'),source=document.getElementById('origin').value,size=document.getElementById('size').value;root.replaceChildren();for(const[key,title]of Object.entries(names)){const f=document.createElement('figure'),i=new Image(),c=document.createElement('figcaption');i.src=source+'-'+key+(['number','network','accounts','cards'].includes(key)?'-'+size:'')+'.png';i.alt=title;c.textContent=title;f.append(i,c);root.append(f)}}for(const id of ['origin','size'])document.getElementById(id).onchange=update;update();</script></html>
