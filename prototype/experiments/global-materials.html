<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NANFEILAOTOU / Global 素材首批</title><link rel="stylesheet" href="lab.css"></head><body><main class="sheet"><nav class="lab-nav"><a href="../prototype-02.html">NANFEILAOTOU / GLOBAL STUDIES</a><span><a href="global-brands.html">Global 彩色品牌</a><a href="card-particle.html">卡面实验 ↗</a></span></nav><h1>卡面，是链路中的一个界面。</h1><p>本轮使用提供的 StarryBlu、Bybit 完整正面图；招行官网蓝色 Mastercard 普卡作为第三张辅助卡。原始文件不缩图、不改色；StarryBlu 演示号码与姓名只在预览采样时遮蔽。招行卡为万事达人民币 IC 借记卡，不与全币种信用卡混称。</p><div class="asset-list" id="cards"></div><h2>Global / 彩色品牌素材</h2><div class="brand-list" id="telco"></div><footer>卡面和品牌归各权利人所有。当前为本地实验素材，不构成公开复用授权，也不代表开户、可用地区或服务状态。<a href="../../assets/cards/SOURCES.md">逐项来源与使用条件</a> · <a href="../../docs/GLOBAL-CARD-LAB.md">调研与测试说明</a></footer></main><script src="../../data/global-materials.js"></script><script src="card-surface.js"></script><script>
(async()=>{for(const item of NF_CARD_MATERIALS){const row=document.createElement('article');row.className='asset-entry';const view=document.createElement('div');view.className='asset-view';const loaded=await NFCardSurface.load(item);loaded.canvas.setAttribute('role','img');loaded.canvas.setAttribute('aria-label',item.name+' 公开卡面，已排除个人卡信息');view.append(loaded.canvas);const h=document.createElement('h2');h.textContent=item.name;const meta=document.createElement('div');meta.className='mono';meta.textContent=item.variant;const p=document.createElement('p');p.textContent=item.description;const privacy=document.createElement('p');privacy.textContent=item.privacy+(item.status?' '+item.status:'');const links=document.createElement('div');links.className='links';const a=document.createElement('a');a.href=item.sourcePage;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.sourceLabel||'官方来源 ↗';const demo=document.createElement('a');demo.href='card-particle.html?card='+item.id;demo.textContent='用于粒子实验 →';links.append(a,demo);row.append(view,h,meta,p,privacy,links);document.getElementById('cards').append(row);}for(const item of NF_GLOBAL_BRANDS){const entry=document.createElement('a');entry.className='telco '+(item.background==='light'?'light-brand':'');entry.href=item.sourcePage;entry.target='_blank';entry.rel='noopener noreferrer';const img=new Image();img.src='../../assets/'+item.asset;img.alt=item.name;if(item.padded)img.className='padded-brand';if(item.name==='Club Sim')img.style.maxWidth='105px';const text=document.createElement('span');text.textContent=item.provider;entry.append(img,text);document.getElementById('telco').append(entry);}document.documentElement.dataset.ready='true';})();
</script></body></html>
